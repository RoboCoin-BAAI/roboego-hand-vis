[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboego-hand-vis"
version = "0.1.0"
description = "Ropedia ego-hand mesh/depth visualization pipeline"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "numpy",
    "opencv-python",
    "rerun-sdk",
    "scipy",
    "torch",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["roboegopipe*", "scripts*"]
