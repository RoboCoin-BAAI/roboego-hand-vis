[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboego-hand-vis"
version = "0.1.0"
description = "Ropedia ego-hand mesh/depth visualization pipeline"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "kedro>=1.5,<2.0",
    "numpy",
    "opencv-python",
    "PyYAML",
    "rerun-sdk",
    "scipy",
    "torch",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["roboego_hand_vis*", "scripts*"]

[tool.kedro]
package_name = "roboego_hand_vis"
project_name = "roboego-hand-vis"
kedro_init_version = "1.5.0"
tools = ""
example_pipeline = "False"
source_dir = "."
