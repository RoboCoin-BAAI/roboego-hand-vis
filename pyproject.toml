[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboego-hand-vis"
version = "0.1.0"
description = "Ropedia ego-hand mesh/depth visualization pipeline"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "numpy",
    "opencv-python",
    "PyYAML",
    "rerun-sdk",
    "scipy",
    "torch",
]

[project.optional-dependencies]
dev = ["pytest", "pyarrow"]
privacy = ["ultralytics>=8.2.0", "opencv-python>=4.9.0", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["."]
include = ["roboego_hand_vis*", "scripts*"]
