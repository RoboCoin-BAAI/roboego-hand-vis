name: stereo_depth_gate
description: 深度估计前的双目视频质量门禁，只输出质量结论，不调用深度估计。
entrypoint: python roboego_hand_vis/stereo_depth_gate/run.py
recommended_config: recommended.yaml
inputs:
  required:
    - session
  optional:
    - config
    - manifest
    - output_dir
outputs:
  files:
    - path: "{session}/quality/stereo_depth_gate/stereo_depth_gate_report.json"
      description: 汇总门禁结果，包含视频信息、抽样指标、checks、sample_frames、usable_for_depth 和 depth_risk_level。
runtime:
  recommended_env: py312
  gpu: not_required
  cuda: not_required
dependencies:
  pip:
    - numpy
    - opencv-python
    - PyYAML
  system: []
  external_repos: []
  notes:
    - This stage only records the recommended environment and dependencies; it does not create or modify environments.
