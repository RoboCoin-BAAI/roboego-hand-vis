schema_version: "1.0"
stage: post_annotation_actions
description: Recommended default parameters for post-Qwen action standardization.

runtime:
  recommended_env: py312
  requires_gpu: false
  requires_network: true
  api_key_env: DASHSCOPE_API_KEY

parameters:
  text_model: qwen-plus
  use_vl_object_resolver: true
  vl_object_model: qwen-vl-plus
  max_vl_frames_per_chunk: 30
  api_key_env: DASHSCOPE_API_KEY
  timeout_s: 120.0
  action_chunk_dir:
  review_chunk_dir:
  resolved_chunk_dir:
  merged_output_json:
  frames_dir:
  overwrite: false

io:
  qwen_chunk_dir: "{session}/annotation/qwen_frame_annotation_chunks"
  output_dir: "{session}/annotation"

notes:
  - This file records recommended parameters only; it does not create or modify environments.
  - The stage converts legacy frame actions to robolabel phase actions.
  - qwen-vl-plus is used to check adjacent-second object identity when frame images are available.

