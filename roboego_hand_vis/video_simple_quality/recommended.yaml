schema_version: "1.0"
stage: video_simple_quality
description: Recommended default parameters for rough single-video quality screening.

runtime:
  recommended_env: py312
  requires_gpu: false

parameters:
  sample_every_s: 1.0
  dark_threshold: 10
  bright_threshold: 245
  max_black_ratio: 0.98
  max_overexposed_ratio: 0.98
  min_texture_std: 3.0
  freeze_absdiff_threshold: 1.5
  low_motion_absdiff_threshold: 4.0
  min_freeze_duration_s: 5.0
  min_bad_visual_duration_s: 3.0

io:
  video: "{session}/videos/left.mp4"
  output_json: "{session}/annotation/video_simple_quality_left.json"

notes:
  - This file records recommended parameters only; it does not create or modify environments.
  - The stage samples frames instead of decoding the whole video into memory.
