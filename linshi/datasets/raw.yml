dataset:
  name: raw
  type: raw_headband
  fps: 30
  camera_streams:
    - left
    - right

runtime:
  ego_python: python
  hamer_python: python
  sam3_python: python

paths:
  workspace_root: "{project_parent}"
  conda_root: ""
  annotation_dir: "{session}/annotation"
  segments_root: "{session}/segments"
  hand_windows_json: "{session}/annotation/hand_estimation_windows_left_v1.json"
  stage1_actions: "{session}/annotation/stage1_action_resolved_chunks"
  processing_plan: "{session}/annotation/processing_plan_left_v1.json"

workflows:
  base_prepare:
    strategy: duration_prepare_workflow
    short_max_s: 180
    medium_max_s: 900
    common_steps:
      - qwen_annotation
      - post_annotation_actions
      - processing_plan
      - hand_windows
    short_steps:
      - stage: materialize_auto
        state_stages:
          - materialize_auto
          - prepare_stereo
    medium_steps:
      - stage: materialize_hand_windows
        state_stages:
          - materialize_auto
      - stage: prepare_stereo
        state_stages:
          - prepare_stereo
        all_hand_windows: true
    long_steps:
      - stage: materialize_segment_hand_windows
        state_stages:
          - materialize_auto
      - stage: prepare_stereo
        state_stages:
          - prepare_stereo
        all_hand_windows: true

  phase1_depth:
    strategy: duration_depth_workflow
    short_max_s: 180
    medium_max_s: 900
    short_steps:
      - stage: materialize_session
        state_stages:
          - materialize_auto
          - prepare_stereo
      - stereo_summary_quality
      - stereo_quality
      - fast_foundation_depth
      - depth_numeric_quality
      - archive_depth_cache
    medium_steps:
      - stage: materialize_hand_windows
        state_stages:
          - materialize_auto
      - stage: prepare_stereo
        all_hand_windows: true
      - stage: stereo_summary_quality
        all_hand_windows: true
      - stage: stereo_quality
        all_hand_windows: true
      - stage: fast_foundation_depth
        all_hand_windows: true
      - stage: depth_numeric_quality
        all_hand_windows: true
      - stage: archive_depth_cache
        all_hand_windows: true
    long_steps:
      - stage: materialize_segment_hand_windows
        state_stages:
          - materialize_auto
      - stage: stereo_summary_quality
        all_hand_windows: true
      - stage: stereo_quality
        all_hand_windows: true
      - stage: fast_foundation_depth
        all_hand_windows: true
      - stage: depth_numeric_quality
        all_hand_windows: true
      - stage: archive_depth_cache
        all_hand_windows: true

  depth_estimation:
    steps:
      - stage: stereo_summary_quality
        all_hand_windows: true
      - stage: fast_foundation_depth
        all_hand_windows: true

stages:
  raw_quality:
    pipeline: quality
    node: raw_headband_quality_gate
    selector: --to-nodes
    scope: session
    param_namespace: raw_headband_quality
    extra_params:
      raw_headband_quality_gate:
        strict: false
    params:
      enabled: true
      session_dir: "{session}"
      output_root: "{session}"
      camera_streams: left|right
      timestamp_tolerance_s: 0.005
      repair_timestamp_files: true
      max_repair_duplicate_rate: 0.01
      max_repair_consecutive_duplicate_frames: 5
      overwrite: true

  pre_semantic_quality:
    pipeline: quality
    node: video_simple_quality_gate
    selector: --to-nodes
    scope: session
    param_namespace: pre_semantic_quality
    extra_params:
      raw_headband_quality:
        enabled: true
        session_dir: "{session}"
        output_root: "{session}"
        camera_streams: left|right
        overwrite: true
      raw_headband_quality_gate:
        strict: false
    params:
      enabled: true
      video: "{session}/videos/left.mp4"
      output_json: "{session}/annotation/video_simple_quality_left.json"

  video_simple_quality:
    pipeline: quality
    node: video_simple_quality_gate
    selector: --to-nodes
    scope: session
    param_namespace: pre_semantic_quality
    extra_params:
      raw_headband_quality:
        enabled: true
        session_dir: "{session}"
        output_root: "{session}"
        camera_streams: left|right
        overwrite: true
      raw_headband_quality_gate:
        strict: false
    params:
      enabled: true
      video: "{session}/videos/left.mp4"
      output_json: "{session}/annotation/video_simple_quality_left.json"

  qwen_annotation:
    pipeline: __default__
    node: qwen_frame_annotation
    selector: --to-nodes
    scope: session
    param_namespace: qwen_frame_annotation
    params:
      enabled: true
      video: "{session}/videos/left.mp4"
      output_json: "{session}/annotation/qwen_frame_annotations_left_v4.json"
      checkpoint_json: "{session}/annotation/qwen_frame_annotations_left_v4.checkpoint.json"
      frames_dir: "{session}/annotation/qwen_frame_annotation_frames"
      raw_output_dir: "{session}/annotation/qwen_frame_annotation_raw"
      batch_output_dir: "{session}/annotation/qwen_frame_annotation_batches"
      chunk_output_dir: "{session}/annotation/qwen_frame_annotation_chunks"
      prompt: docs/prompts/qwen_frame_annotation_v5_en.md
      fps: 1
      start_s: 0
      require_video_simple_quality_pass: false
      use_video_simple_quality: false
      max_width: 768
      batch_size: 10
      batches_per_chunk: 5
      model: qwen3.6-flash
      timeout_s: 120
      max_retries: 3
      retry_sleep_s: 5
      resume: true

  post_annotation_actions:
    pipeline: semantic
    node: stage1_action_text_resolver_chunks
    selector: --to-nodes
    scope: session
    param_namespace: stage1_action_chunks
    params:
      enabled: true
      qwen_chunk_dir: "{session}/annotation/qwen_frame_annotation_chunks"
      action_chunk_dir: "{session}/annotation/stage1_action_chunks"
      review_chunk_dir: "{session}/annotation/stage1_action_text_review_chunks"
      resolved_chunk_dir: "{session}/annotation/stage1_action_resolved_chunks"
      merged_output_json: "{session}/annotation/stage1_actions_left_v1_resolved.json"
      frames_dir: "{session}/annotation/qwen_frame_annotation_frames"
      model: qwen-plus
      use_vl_object_resolver: true
      vl_object_model: qwen-vl-plus
      max_vl_frames_per_chunk: 30
      overwrite: false

  processing_plan:
    pipeline: semantic
    node: build_processing_plan
    scope: session
    param_namespace: processing_plan
    params:
      enabled: true
      stage1_json: "{session}/annotation/qwen_frame_annotations_left_v4.checkpoint.json"
      actions_json: "{session}/annotation/stage1_action_resolved_chunks"
      output_json: "{session}/annotation/processing_plan_left_v1.json"
      min_process_segment_s: 5
      context_expand_s: 2

  hand_windows:
    pipeline: semantic
    node: build_hand_estimation_windows
    scope: session
    param_namespace: hand_estimation_windows
    params:
      enabled: true
      stage1_actions: "{session}/annotation/stage1_action_resolved_chunks"
      processing_plan: "{session}/annotation/processing_plan_left_v1.json"
      output_json: "{session}/annotation/hand_estimation_windows_left_v1.json"
      hand_window_mode: two
      context_expand_s: 2
      merge_gap_s: 2
      merge_after_expand: true
      min_window_s: 5
      min_priority: high
      fps: 30

  hand_visibility_gate:
    pipeline: semantic
    node: hand_visibility_gate
    scope: session
    param_namespace: hand_visibility_gate
    params:
      enabled: true
      stage1_json: "{session}/annotation/qwen_frame_annotations_left_v4.checkpoint.json"
      hand_windows_json: "{session}/annotation/hand_estimation_windows_left_v1.json"
      processing_plan_json: "{session}/annotation/processing_plan_left_v1.json"
      output_json: "{session}/annotation/hand_visibility_quality_gate_left_v1.json"
      min_core_both_hands_visible_rate: 0.6
      unit_source: processing_plan

  export_segments:
    pipeline: datasets
    node: export_selected_video_segments
    scope: session
    param_namespace: export_selected_video_segments
    params:
      enabled: true
      session: "{session}"
      processing_plan: "{session}/annotation/processing_plan_left_v1.json"
      output_dir: "{session}/segments"
      camera_streams:
        - left
        - right
      overwrite: true

  materialize_session:
    pipeline: datasets
    node: prepare_stereo_unit
    scope: session
    param_namespace: prepare_stereo_unit
    params:
      enabled: true
      session: "{session}"
      unit_root: "{session}"
      roboegopipe_root: "{workspace_root}/RoboEgoPipe"
      model: equidistant
      balance: 0.0
      overwrite: true

  materialize_segments:
    pipeline: datasets
    node: export_selected_video_segments
    scope: session
    param_namespace: export_selected_video_segments
    params:
      enabled: true
      session: "{session}"
      processing_plan: "{session}/annotation/processing_plan_left_v1.json"
      output_dir: "{session}/segments"
      camera_streams:
        - left
        - right
      overwrite: true

  materialize_segment_hand_windows:
    pipeline: datasets
    node: export_hand_window_segments
    selector: --to-nodes
    scope: session
    param_namespace: export_hand_window_segments
    extra_params:
      export_selected_video_segments:
        enabled: true
        session: "{session}"
        processing_plan: "{session}/annotation/processing_plan_left_v1.json"
        output_dir: "{session}/segments"
        camera_streams:
          - left
          - right
        overwrite: true
      prepare_selected_segments:
        enabled: true
        session: "{session}"
        segments_root: "{session}/segments"
        roboegopipe_root: "{workspace_root}/RoboEgoPipe"
        model: equidistant
        balance: 0.0
        overwrite: true
    params:
      enabled: true
      segments_root: "{session}/segments"
      hand_windows_json: "{session}/annotation/hand_estimation_windows_left_v1.json"
      overwrite: true

  materialize_auto:
    strategy: duration_materialization
    short_max_s: 180
    medium_max_s: 900
    short_stage: materialize_session
    medium_stage: materialize_hand_windows
    long_stage: materialize_segment_hand_windows

  prepare_segments:
    pipeline: datasets
    node: prepare_selected_segments
    scope: session
    param_namespace: prepare_selected_segments
    params:
      enabled: true
      session: "{session}"
      segments_root: "{session}/segments"
      roboegopipe_root: "{workspace_root}/RoboEgoPipe"
      model: equidistant
      balance: 0.0

  prepare_stereo:
    pipeline: datasets
    node: prepare_stereo_unit
    scope: unit
    param_namespace: prepare_stereo_unit
    params:
      enabled: true
      session: "{session}"
      unit_root: "{unit}"
      roboegopipe_root: "{workspace_root}/RoboEgoPipe"
      model: equidistant
      balance: 0.0
      overwrite: true

  export_hand_window_segments:
    pipeline: datasets
    node: export_hand_window_segments
    scope: session
    param_namespace: export_hand_window_segments
    params:
      enabled: true
      segments_root: "{session}/segments"
      hand_windows_json: "{session}/annotation/hand_estimation_windows_left_v1.json"
      overwrite: true

  direct_hand_window_segments:
    pipeline: datasets
    node: export_direct_hand_window_segments
    scope: session
    param_namespace: export_direct_hand_window_segments
    params:
      enabled: true
      session: "{session}"
      hand_windows_json: "{session}/annotation/hand_estimation_windows_left_v1.json"
      output_dir: "{session}/hand_windows"
      camera_streams:
        - left
        - right
      overwrite: true

  materialize_hand_windows:
    pipeline: datasets
    node: export_direct_hand_window_segments
    scope: session
    param_namespace: export_direct_hand_window_segments
    params:
      enabled: true
      session: "{session}"
      hand_windows_json: "{session}/annotation/hand_estimation_windows_left_v1.json"
      output_dir: "{session}/hand_windows"
      camera_streams:
        - left
        - right
      overwrite: true

  stereo_quality:
    pipeline: quality
    node: stereo_segment_quality
    scope: prepared_unit
    param_namespace: stereo_segment_quality
    params:
      enabled: true
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      output_dir: "{unit}/quality/stereo_segments"
      sample_every_s: 1.0
      orb_every_s: 5.0

  stereo_summary_quality:
    pipeline: quality
    node: stereo_summary_quality
    scope: prepared_unit
    param_namespace: stereo_summary_quality
    params:
      enabled: true
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      output_dir: "{unit}/quality/stereo_summary"
      sample_count: 12

  stereo_quality_unit:
    pipeline: quality
    node: stereo_segment_quality
    scope: unit
    param_namespace: stereo_segment_quality
    params:
      enabled: true
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      output_dir: "{unit}/quality/stereo_segments"
      sample_every_s: 1.0
      orb_every_s: 5.0

  stereo_summary_quality_unit:
    pipeline: quality
    node: stereo_summary_quality
    scope: unit
    param_namespace: stereo_summary_quality
    params:
      enabled: true
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      output_dir: "{unit}/quality/stereo_summary"
      sample_count: 12

  fast_foundation_depth:
    pipeline: depth
    node: fast_foundation_stereo_depth
    scope: prepared_unit
    param_namespace: fast_foundation_stereo_depth
    params:
      enabled: true
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      output_dir: "{unit}/depth/fast_foundation"
      stereo_quality_report: "{unit}/quality/stereo_summary/stereo_quality_report.json"
      fast_foundation_root: "{workspace_root}/Fast-FoundationStereo"
      start: 0
      num_frames: "{num_frames}"
      scale: 1.0
      valid_iters: 4
      max_disp: 192
      max_depth_m: 4.0
      save_depth_png: true
      save_npy: false
      save_vis: true
      overwrite: true

  fast_foundation_depth_unit:
    pipeline: depth
    node: fast_foundation_stereo_depth
    scope: unit
    param_namespace: fast_foundation_stereo_depth
    params:
      enabled: true
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      output_dir: "{unit}/depth/fast_foundation"
      stereo_quality_report: "{unit}/quality/stereo_summary/stereo_quality_report.json"
      fast_foundation_root: "{workspace_root}/Fast-FoundationStereo"
      start: 0
      num_frames: "{num_frames}"
      scale: 1.0
      valid_iters: 4
      max_disp: 192
      max_depth_m: 4.0
      save_depth_png: true
      save_npy: false
      save_vis: true
      overwrite: true

  depth_quality:
    pipeline: quality
    node: depth_quality
    scope: prepared_unit
    param_namespace: depth_quality
    params:
      enabled: true
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      depth_dir: "{unit}/depth/fast_foundation"
      output_dir: "{unit}/quality/depth"
      stereo_quality_report: "{unit}/quality/stereo_segments/bad_segments.json"
      start: 0
      num_frames: "{num_frames}"
      min_depth_m: 0.15
      max_depth_m: 4.0

  depth_numeric_quality:
    pipeline: quality
    node: depth_numeric_quality
    scope: prepared_unit
    param_namespace: depth_numeric_quality
    params:
      enabled: true
      depth_dir: "{unit}/depth/fast_foundation"
      output_dir: "{unit}/quality/depth_numeric"
      start: 0
      num_frames: "{num_frames}"
      min_depth_m: 0.15
      max_depth_m: 4.0
      min_valid_depth_ratio: 0.5
      min_depth_std_m: 0.02
      min_depth_iqr_m: 0.03
      max_near_ratio: 0.8
      max_far_ratio: 0.8
      max_median_delta_m: 0.5
      min_valid_mask_iou: 0.5

  depth_numeric_quality_unit:
    pipeline: quality
    node: depth_numeric_quality
    scope: unit
    param_namespace: depth_numeric_quality
    params:
      enabled: true
      depth_dir: "{unit}/depth/fast_foundation"
      output_dir: "{unit}/quality/depth_numeric"
      start: 0
      num_frames: "{num_frames}"
      min_depth_m: 0.15
      max_depth_m: 4.0
      min_valid_depth_ratio: 0.5
      min_depth_std_m: 0.02
      min_depth_iqr_m: 0.03
      max_near_ratio: 0.8
      max_far_ratio: 0.8
      max_median_delta_m: 0.5
      min_valid_mask_iou: 0.5

  archive_depth_cache:
    pipeline: depth
    node: archive_depth_cache
    scope: prepared_unit
    param_namespace: archive_depth_cache
    params:
      enabled: true
      depth_dir: "{unit}/depth/fast_foundation"
      output_dir: "{unit}/depth/fast_foundation_archive"
      max_depth_m: 4.0
      invalid_value: 0
      fps: 30
      ffmpeg_bin: /usr/bin/ffmpeg
      write_png: false
      write_avi: false
      ffv1_container: mkv
      write_preview: true
      preview_mode: near
      preview_near_min_m: 0.15
      preview_near_max_m: 3.0
      preview_contrast_percentile: 2.0
      preview_codec: mp4v
      write_hevc12: true
      hevc12_crf: 0
      hevc12_preset: fast
      hevc12_lossless: false
      write_valid_mask: true
      delete_npy: false
      delete_png: false

  archive_depth_cache_unit:
    pipeline: depth
    node: archive_depth_cache
    scope: unit
    param_namespace: archive_depth_cache
    params:
      enabled: true
      depth_dir: "{unit}/depth/fast_foundation"
      output_dir: "{unit}/depth/fast_foundation_archive"
      max_depth_m: 4.0
      invalid_value: 0
      fps: 30
      ffmpeg_bin: /usr/bin/ffmpeg
      write_png: false
      write_avi: false
      ffv1_container: mkv
      write_preview: true
      preview_mode: near
      preview_near_min_m: 0.15
      preview_near_max_m: 3.0
      preview_contrast_percentile: 2.0
      preview_codec: mp4v
      write_hevc12: true
      hevc12_crf: 0
      hevc12_preset: fast
      hevc12_lossless: false
      write_valid_mask: true
      delete_npy: true
      delete_png: false

  sam3_objects:
    pipeline: objects
    node: sam3_hand_object_segmentation
    scope: hand_window
    default_all_hand_windows: true
    param_namespace: sam3_hand_object_segmentation
    params:
      enabled: true
      hand_window_dir: "{hand_window}"
      stage1_actions: "{session}/annotation/qwen_frame_annotations_left_v4.checkpoint.json"
      windows_json: "{session}/annotation/hand_estimation_windows_left_v1.json"
      auto_from_stage1: true
      clip_by_intervals: true
      interval_expand_s: 0
      interval_merge_gap_s: 0
      sam3_script: scripts/object/run_sam3_video.py
      sam3_python: "{sam3_python}"
      checkpoint: "{workspace_root}/do-as-i-do/sam3/sam3.pt"
      fps: 30

  video_privacy_blur:
    pipeline: privacy
    node: video_privacy_blur
    scope: session
    param_namespace: video_privacy_blur
    params:
      enabled: true
      session_dir: "{session}"
