dataset:
  name: raw
  type: raw_headband
  fps: 30
  camera_streams:
    - left
    - right

runtime:
  kedro_bin: "{conda_root}/envs/ego/bin/kedro"
  ego_python: "{conda_root}/envs/ego/bin/python"
  hamer_python: "{conda_root}/envs/hamer/bin/python"
  sam3_python: "{conda_root}/envs/py312/bin/python"

paths:
  workspace_root: /home/liuyou/Documents
  conda_root: /home/liuyou/miniconda3
  annotation_dir: "{session}/annotation"
  segments_root: "{session}/segments"
  hand_windows_json: "{session}/annotation/hand_estimation_windows_left_v1.json"
  stage1_actions: "{session}/annotation/stage1_action_resolved_chunks"
  processing_plan: "{session}/annotation/processing_plan_left_v1.json"

workflows:
  base_prepare:
    strategy: duration_prepare_workflow
    short_max_s: 180
    medium_max_s: 900
    common_steps:
      - stage: qwen_annotation
        state_stages:
          - raw_quality
          - video_simple_quality
          - qwen_annotation
      - post_annotation_actions
      - processing_plan
      - hand_windows
    short_steps:
      - stage: materialize_auto
        state_stages:
          - materialize_auto
          - prepare_stereo
    medium_steps:
      - stage: materialize_hand_windows
        state_stages:
          - materialize_auto
      - stage: prepare_stereo
        state_stages:
          - prepare_stereo
        all_hand_windows: true
    long_steps:
      - stage: materialize_segment_hand_windows
        state_stages:
          - materialize_auto
      - stage: prepare_stereo
        state_stages:
          - prepare_stereo
        all_hand_windows: true

  phase1_depth:
    strategy: duration_depth_workflow
    short_max_s: 180
    medium_max_s: 900
    short_steps:
      - stage: materialize_session
        state_stages:
          - materialize_auto
          - prepare_stereo
      - stereo_summary_quality
      - stereo_quality
      - fast_foundation_depth
      - depth_numeric_quality
      - archive_depth_cache
    medium_steps:
      - stage: materialize_hand_windows
        state_stages:
          - materialize_auto
      - stage: prepare_stereo
        all_hand_windows: true
      - stage: stereo_summary_quality
        all_hand_windows: true
      - stage: stereo_quality
        all_hand_windows: true
      - stage: fast_foundation_depth
        all_hand_windows: true
      - stage: depth_numeric_quality
        all_hand_windows: true
      - stage: archive_depth_cache
        all_hand_windows: true
    long_steps:
      - stage: materialize_segment_hand_windows
        state_stages:
          - materialize_auto
      - stage: stereo_summary_quality
        all_hand_windows: true
      - stage: stereo_quality
        all_hand_windows: true
      - stage: fast_foundation_depth
        all_hand_windows: true
      - stage: depth_numeric_quality
        all_hand_windows: true
      - stage: archive_depth_cache
        all_hand_windows: true

  depth_estimation:
    steps:
      - stage: stereo_summary_quality
        all_hand_windows: true
      - stage: fast_foundation_depth
        all_hand_windows: true

stages:
  raw_quality:
    pipeline: quality
    node: raw_headband_quality_gate
    selector: --to-nodes
    scope: session
    param_namespace: raw_headband_quality
    extra_params:
      raw_headband_quality_gate:
        strict: false
    params:
      enabled: true
      session_dir: "{session}"
      output_root: "{session}"
      camera_streams: left|right
      timestamp_tolerance_s: 0.005
      repair_timestamp_files: true
      max_repair_duplicate_rate: 0.01
      max_repair_consecutive_duplicate_frames: 5
      overwrite: true

  pre_semantic_quality:
    pipeline: quality
    node: video_simple_quality_gate
    selector: --to-nodes
    scope: session
    param_namespace: pre_semantic_quality
    extra_params:
      raw_headband_quality:
        enabled: true
        session_dir: "{session}"
        output_root: "{session}"
        camera_streams: left|right
        overwrite: true
      raw_headband_quality_gate:
        strict: false
    params:
      enabled: true
      video: "{session}/videos/left.mp4"
      output_json: "{session}/annotation/video_simple_quality_left.json"

  video_simple_quality:
    pipeline: quality
    node: video_simple_quality_gate
    selector: --to-nodes
    scope: session
    param_namespace: pre_semantic_quality
    extra_params:
      raw_headband_quality:
        enabled: true
        session_dir: "{session}"
        output_root: "{session}"
        camera_streams: left|right
        overwrite: true
      raw_headband_quality_gate:
        strict: false
    params:
      enabled: true
      video: "{session}/videos/left.mp4"
      output_json: "{session}/annotation/video_simple_quality_left.json"

  qwen_annotation:
    pipeline: __default__
    node: qwen_frame_annotation
    selector: --to-nodes
    scope: session
    param_namespace: qwen_frame_annotation
    extra_params:
      raw_headband_quality:
        enabled: true
        session_dir: "{session}"
        output_root: "{session}"
        camera_streams: left|right
        overwrite: true
      raw_headband_quality_gate:
        strict: false
      pre_semantic_quality:
        enabled: true
        video: "{session}/videos/left.mp4"
        output_json: "{session}/annotation/video_simple_quality_left.json"
    params:
      enabled: true
      video: "{session}/videos/left.mp4"
      output_json: "{session}/annotation/qwen_frame_annotations_left_v4.json"
      checkpoint_json: "{session}/annotation/qwen_frame_annotations_left_v4.checkpoint.json"
      frames_dir: "{session}/annotation/qwen_frame_annotation_frames"
      raw_output_dir: "{session}/annotation/qwen_frame_annotation_raw"
      batch_output_dir: "{session}/annotation/qwen_frame_annotation_batches"
      chunk_output_dir: "{session}/annotation/qwen_frame_annotation_chunks"
      prompt: docs/prompts/qwen_frame_annotation_v5_en.md
      fps: 1
      start_s: 0
      require_video_simple_quality_pass: true
      use_video_simple_quality: false
      max_width: 768
      batch_size: 10
      batches_per_chunk: 5
      model: qwen3.6-flash
      timeout_s: 120
      max_retries: 3
      retry_sleep_s: 5
      resume: true

  post_annotation_actions:
    pipeline: semantic
    node: stage1_action_text_resolver_chunks
    selector: --to-nodes
    scope: session
    param_namespace: stage1_action_chunks
    params:
      enabled: true
      qwen_chunk_dir: "{session}/annotation/qwen_frame_annotation_chunks"
      action_chunk_dir: "{session}/annotation/stage1_action_chunks"
      review_chunk_dir: "{session}/annotation/stage1_action_text_review_chunks"
      resolved_chunk_dir: "{session}/annotation/stage1_action_resolved_chunks"
      merged_output_json: "{session}/annotation/stage1_actions_left_v1_resolved.json"
      model: qwen-plus
      overwrite: false

  processing_plan:
    pipeline: semantic
    node: build_processing_plan
    scope: session
    param_namespace: processing_plan
    params:
      enabled: true
      stage1_json: "{session}/annotation/qwen_frame_annotations_left_v4.checkpoint.json"
      actions_json: "{session}/annotation/stage1_action_resolved_chunks"
      output_json: "{session}/annotation/processing_plan_left_v1.json"
      min_process_segment_s: 5
      context_expand_s: 2

  hand_windows:
    pipeline: semantic
    node: build_hand_estimation_windows
    scope: session
    param_namespace: hand_estimation_windows
    params:
      enabled: true
      stage1_actions: "{session}/annotation/stage1_action_resolved_chunks"
      processing_plan: "{session}/annotation/processing_plan_left_v1.json"
      output_json: "{session}/annotation/hand_estimation_windows_left_v1.json"
      hand_window_mode: two
      context_expand_s: 2
      merge_gap_s: 2
      merge_after_expand: true
      min_window_s: 5
      min_priority: high
      fps: 30

  hand_visibility_gate:
    pipeline: semantic
    node: hand_visibility_gate
    scope: session
    param_namespace: hand_visibility_gate
    params:
      enabled: true
      stage1_json: "{session}/annotation/qwen_frame_annotations_left_v4.checkpoint.json"
      hand_windows_json: "{session}/annotation/hand_estimation_windows_left_v1.json"
      processing_plan_json: "{session}/annotation/processing_plan_left_v1.json"
      output_json: "{session}/annotation/hand_visibility_quality_gate_left_v1.json"
      min_core_both_hands_visible_rate: 0.6
      unit_source: processing_plan

  export_segments:
    pipeline: datasets
    node: export_selected_video_segments
    scope: session
    param_namespace: export_selected_video_segments
    params:
      enabled: true
      session: "{session}"
      processing_plan: "{session}/annotation/processing_plan_left_v1.json"
      output_dir: "{session}/segments"
      camera_streams:
        - left
        - right
      overwrite: true

  materialize_session:
    pipeline: datasets
    node: prepare_stereo_unit
    scope: session
    param_namespace: prepare_stereo_unit
    params:
      enabled: true
      session: "{session}"
      unit_root: "{session}"
      roboegopipe_root: "{workspace_root}/RoboEgoPipe"
      model: equidistant
      balance: 0.0
      overwrite: true

  materialize_segments:
    pipeline: datasets
    node: export_selected_video_segments
    scope: session
    param_namespace: export_selected_video_segments
    params:
      enabled: true
      session: "{session}"
      processing_plan: "{session}/annotation/processing_plan_left_v1.json"
      output_dir: "{session}/segments"
      camera_streams:
        - left
        - right
      overwrite: true

  materialize_segment_hand_windows:
    pipeline: datasets
    node: export_hand_window_segments
    selector: --to-nodes
    scope: session
    param_namespace: export_hand_window_segments
    extra_params:
      export_selected_video_segments:
        enabled: true
        session: "{session}"
        processing_plan: "{session}/annotation/processing_plan_left_v1.json"
        output_dir: "{session}/segments"
        camera_streams:
          - left
          - right
        overwrite: true
      prepare_selected_segments:
        enabled: true
        session: "{session}"
        segments_root: "{session}/segments"
        roboegopipe_root: "{workspace_root}/RoboEgoPipe"
        model: equidistant
        balance: 0.0
        overwrite: true
    params:
      enabled: true
      segments_root: "{session}/segments"
      hand_windows_json: "{session}/annotation/hand_estimation_windows_left_v1.json"
      overwrite: true

  materialize_auto:
    strategy: duration_materialization
    short_max_s: 180
    medium_max_s: 900
    short_stage: materialize_session
    medium_stage: materialize_hand_windows
    long_stage: materialize_segment_hand_windows

  prepare_segments:
    pipeline: datasets
    node: prepare_selected_segments
    scope: session
    param_namespace: prepare_selected_segments
    params:
      enabled: true
      session: "{session}"
      segments_root: "{session}/segments"
      roboegopipe_root: "{workspace_root}/RoboEgoPipe"
      model: equidistant
      balance: 0.0

  prepare_stereo:
    pipeline: datasets
    node: prepare_stereo_unit
    scope: unit
    param_namespace: prepare_stereo_unit
    params:
      enabled: true
      session: "{session}"
      unit_root: "{unit}"
      roboegopipe_root: "{workspace_root}/RoboEgoPipe"
      model: equidistant
      balance: 0.0
      overwrite: true

  export_hand_window_segments:
    pipeline: datasets
    node: export_hand_window_segments
    scope: session
    param_namespace: export_hand_window_segments
    params:
      enabled: true
      segments_root: "{session}/segments"
      hand_windows_json: "{session}/annotation/hand_estimation_windows_left_v1.json"
      overwrite: true

  direct_hand_window_segments:
    pipeline: datasets
    node: export_direct_hand_window_segments
    scope: session
    param_namespace: export_direct_hand_window_segments
    params:
      enabled: true
      session: "{session}"
      hand_windows_json: "{session}/annotation/hand_estimation_windows_left_v1.json"
      output_dir: "{session}/hand_windows"
      camera_streams:
        - left
        - right
      overwrite: true

  materialize_hand_windows:
    pipeline: datasets
    node: export_direct_hand_window_segments
    scope: session
    param_namespace: export_direct_hand_window_segments
    params:
      enabled: true
      session: "{session}"
      hand_windows_json: "{session}/annotation/hand_estimation_windows_left_v1.json"
      output_dir: "{session}/hand_windows"
      camera_streams:
        - left
        - right
      overwrite: true

  stereo_quality:
    pipeline: quality
    node: stereo_segment_quality
    scope: prepared_unit
    param_namespace: stereo_segment_quality
    params:
      enabled: true
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      output_dir: "{unit}/quality/stereo_segments"
      sample_every_s: 1.0
      orb_every_s: 5.0

  stereo_summary_quality:
    pipeline: quality
    node: stereo_summary_quality
    scope: prepared_unit
    param_namespace: stereo_summary_quality
    params:
      enabled: true
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      output_dir: "{unit}/quality/stereo_summary"
      sample_count: 12

  stereo_quality_unit:
    pipeline: quality
    node: stereo_segment_quality
    scope: unit
    param_namespace: stereo_segment_quality
    params:
      enabled: true
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      output_dir: "{unit}/quality/stereo_segments"
      sample_every_s: 1.0
      orb_every_s: 5.0

  stereo_summary_quality_unit:
    pipeline: quality
    node: stereo_summary_quality
    scope: unit
    param_namespace: stereo_summary_quality
    params:
      enabled: true
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      output_dir: "{unit}/quality/stereo_summary"
      sample_count: 12

  fast_foundation_depth:
    pipeline: depth
    node: fast_foundation_stereo_depth
    scope: prepared_unit
    param_namespace: fast_foundation_stereo_depth
    params:
      enabled: true
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      output_dir: "{unit}/depth/fast_foundation"
      stereo_quality_report: "{unit}/quality/stereo_summary/stereo_quality_report.json"
      fast_foundation_root: "{workspace_root}/Fast-FoundationStereo"
      start: 0
      num_frames: "{num_frames}"
      scale: 1.0
      valid_iters: 4
      max_disp: 192
      max_depth_m: 4.0
      save_depth_png: true
      save_npy: false
      save_vis: true
      overwrite: true

  fast_foundation_depth_unit:
    pipeline: depth
    node: fast_foundation_stereo_depth
    scope: unit
    param_namespace: fast_foundation_stereo_depth
    params:
      enabled: true
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      output_dir: "{unit}/depth/fast_foundation"
      stereo_quality_report: "{unit}/quality/stereo_summary/stereo_quality_report.json"
      fast_foundation_root: "{workspace_root}/Fast-FoundationStereo"
      start: 0
      num_frames: "{num_frames}"
      scale: 1.0
      valid_iters: 4
      max_disp: 192
      max_depth_m: 4.0
      save_depth_png: true
      save_npy: false
      save_vis: true
      overwrite: true

  depth_quality:
    pipeline: quality
    node: depth_quality
    scope: prepared_unit
    param_namespace: depth_quality
    params:
      enabled: true
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      depth_dir: "{unit}/depth/fast_foundation"
      output_dir: "{unit}/quality/depth"
      stereo_quality_report: "{unit}/quality/stereo_segments/bad_segments.json"
      start: 0
      num_frames: "{num_frames}"
      min_depth_m: 0.15
      max_depth_m: 4.0

  depth_numeric_quality:
    pipeline: quality
    node: depth_numeric_quality
    scope: prepared_unit
    param_namespace: depth_numeric_quality
    params:
      enabled: true
      depth_dir: "{unit}/depth/fast_foundation"
      output_dir: "{unit}/quality/depth_numeric"
      start: 0
      num_frames: "{num_frames}"
      min_depth_m: 0.15
      max_depth_m: 4.0
      min_valid_depth_ratio: 0.5
      min_depth_std_m: 0.02
      min_depth_iqr_m: 0.03
      max_near_ratio: 0.8
      max_far_ratio: 0.8
      max_median_delta_m: 0.5
      min_valid_mask_iou: 0.5

  depth_numeric_quality_unit:
    pipeline: quality
    node: depth_numeric_quality
    scope: unit
    param_namespace: depth_numeric_quality
    params:
      enabled: true
      depth_dir: "{unit}/depth/fast_foundation"
      output_dir: "{unit}/quality/depth_numeric"
      start: 0
      num_frames: "{num_frames}"
      min_depth_m: 0.15
      max_depth_m: 4.0
      min_valid_depth_ratio: 0.5
      min_depth_std_m: 0.02
      min_depth_iqr_m: 0.03
      max_near_ratio: 0.8
      max_far_ratio: 0.8
      max_median_delta_m: 0.5
      min_valid_mask_iou: 0.5

  archive_depth_cache:
    pipeline: depth
    node: archive_depth_cache
    scope: prepared_unit
    param_namespace: archive_depth_cache
    params:
      enabled: true
      depth_dir: "{unit}/depth/fast_foundation"
      output_dir: "{unit}/depth/fast_foundation_archive"
      max_depth_m: 4.0
      invalid_value: 0
      fps: 30
      ffmpeg_bin: /usr/bin/ffmpeg
      write_png: false
      write_avi: false
      ffv1_container: mkv
      write_preview: true
      preview_mode: near
      preview_near_min_m: 0.15
      preview_near_max_m: 3.0
      preview_contrast_percentile: 2.0
      preview_codec: mp4v
      write_hevc12: true
      hevc12_crf: 0
      hevc12_preset: fast
      hevc12_lossless: false
      write_valid_mask: true
      delete_npy: false
      delete_png: false

  archive_depth_cache_unit:
    pipeline: depth
    node: archive_depth_cache
    scope: unit
    param_namespace: archive_depth_cache
    params:
      enabled: true
      depth_dir: "{unit}/depth/fast_foundation"
      output_dir: "{unit}/depth/fast_foundation_archive"
      max_depth_m: 4.0
      invalid_value: 0
      fps: 30
      ffmpeg_bin: /usr/bin/ffmpeg
      write_png: false
      write_avi: false
      ffv1_container: mkv
      write_preview: true
      preview_mode: near
      preview_near_min_m: 0.15
      preview_near_max_m: 3.0
      preview_contrast_percentile: 2.0
      preview_codec: mp4v
      write_hevc12: true
      hevc12_crf: 0
      hevc12_preset: fast
      hevc12_lossless: false
      write_valid_mask: true
      delete_npy: true
      delete_png: false

  hamer:
    pipeline: egohand
    node: hamer_unit
    scope: prepared_unit
    param_namespace: hamer_unit
    params:
      enabled: true
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      depth_dir: "{unit}/depth/fast_foundation"
      output_dir: "{unit}/hand/hamer_raw"
      hamer_root: "{workspace_root}/hamer"
      stage1_actions: "{session}/annotation/stage1_action_resolved_chunks"
      wearer_regions_json: "{session}/annotation/qwen_frame_annotations_left_v4.checkpoint.json"
      hamer_python: "{conda_root}/envs/hamer/bin/python"
      start: 0
      num_frames: "{num_frames}"
      ego_mode: tolerant
      stage1_hand_policy: permissive
      stage1_time_offset_s: 0
      body_detector: regnety
      batch_size: 1
      wearer_roi_x_margin_ratio: 0.0
      wearer_roi_y_margin_ratio: 0.10
      save_mesh: true
      save_refined_vis: false
      save_refined_frames: false
      refine_mode: strict_ego_audit

  hand_filter:
    pipeline: egohand
    node: hand_filter
    scope: prepared_unit
    param_namespace: hand_filter
    params:
      enabled: true
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      refined_json: "{unit}/hand/hamer_raw/ego_hand_candidates_refined.json"
      output_dir: "{unit}/hand/filtered"
      start: 0
      num_frames: "{num_frames}"
      max_bbox_jump_px: 360
      max_bbox_area_change_ratio: 8.0
      max_mano_pose_jump: 0
      max_mesh_centroid_jump: 0
      max_mesh_vertex_rmse: 0
      local_window_radius: 2
      save_vis: false

  joints21_pose_gate:
    pipeline: egohand
    node: joints21_pose_gate
    scope: prepared_unit
    param_namespace: joints21_pose_gate
    params:
      enabled: true
      final_tracks_json: "{unit}/hand/filtered/filtered_hand_tracks.json"
      output_dir: "{unit}/hand/joints21_pose_gate"
      start: 0
      num_frames: "{num_frames}"
      drop_fingertips_below_wrist: true
      image_height: "{image_height}"
      max_suspicious_wrist_y_ratio: 0.55
      min_fingertip_below_wrist_ratio: 1.0
      min_fingertip_below_wrist_delta: 0.02

  depth_anchored_joints21:
    pipeline: egohand
    node: depth_anchored_joints21
    scope: prepared_unit
    param_namespace: depth_anchored_joints21
    params:
      enabled: true
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      candidates_json: "{unit}/hand/joints21_pose_gate/final_hand_candidates_gated.json"
      depth_dir: "{unit}/depth/fast_foundation"
      output_dir: "{unit}/hand/joints21_depth_anchored"
      start: 0
      num_frames: "{num_frames}"
      anchor_mode: wrist_palm
      max_depth_m: 2.5
      overlay_frames: auto

  final_hand_result:
    pipeline: egohand
    node: final_hand_result
    scope: prepared_unit
    param_namespace: final_hand_result
    params:
      enabled: true
      tracks_json: "{unit}/hand/joints21_pose_gate/final_hand_candidates_gated.json"
      output_dir: "{unit}/hand/final_hand_result"
      depth_anchored_json: "{unit}/hand/joints21_depth_anchored/joints21_depth_anchored.json"
      depth_anchored_npz: "{unit}/hand/joints21_depth_anchored/joints21_depth_anchored.npz"
      depth_anchored_summary_json: "{unit}/hand/joints21_depth_anchored/joints21_depth_anchored_summary.json"
      copy_meshes: true

  final_hand_trajectory_polish:
    pipeline: egohand
    node: final_hand_trajectory_polish
    scope: prepared_unit
    param_namespace: final_hand_trajectory_polish
    params:
      enabled: true
      joints_json: "{unit}/hand/final_hand_result/joints21_depth_anchored.json"
      output_dir: "{unit}/hand/final_hand_result"
      manifest: "{unit}/dataset_manifest/dataset_manifest.json"
      max_interp_gap: 3
      wrist_jump_m: 0.0
      max_local_wrist_deviation_m: 0.0
      local_window_radius: 5
      smooth_window: 3
      smooth_relative_fingers: true
      write_preview: true

  hand_parquet_export:
    pipeline: egohand
    node: hand_parquet_export
    scope: session
    param_namespace: hand_parquet_export
    params:
      enabled: true
      session: "{session}"

  sam3_objects:
    pipeline: objects
    node: sam3_hand_object_segmentation
    scope: hand_window
    default_all_hand_windows: true
    param_namespace: sam3_hand_object_segmentation
    params:
      enabled: true
      hand_window_dir: "{hand_window}"
      stage1_actions: "{session}/annotation/qwen_frame_annotations_left_v4.checkpoint.json"
      windows_json: "{session}/annotation/hand_estimation_windows_left_v1.json"
      auto_from_stage1: true
      clip_by_intervals: true
      interval_expand_s: 0
      interval_merge_gap_s: 0
      sam3_script: scripts/object/run_sam3_video.py
      sam3_python: "{conda_root}/envs/py312/bin/python"
      checkpoint: "{workspace_root}/do-as-i-do/sam3/sam3.pt"
      fps: 30

